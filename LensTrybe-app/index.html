<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- Added to the home screen on iOS, this is what stops the page opening in Safari
         chrome and what colours the status bar behind it. Android reads the manifest for
         the same thing; iOS still wants these. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LensTrybe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>LensTrybe, Australia's home for visual creatives</title>
    <meta
      name="description"
      content="Showcase your work, get booked, and run your whole business in one place. No commissions, ever. Three months free when you join."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LensTrybe" />
    <meta property="og:title" content="LensTrybe, Australia's home for visual creatives" />
    <meta
      property="og:description"
      content="Showcase your work, get booked, and run your whole business in one place. No commissions, ever. Three months free when you join."
    />
    <meta property="og:url" content="https://lenstrybe.com" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->

    <meta name="twitter:title" content="LensTrybe, Australia's home for visual creatives" />
    <meta
      name="twitter:description"
      content="Showcase your work, get booked, and run your whole business in one place. No commissions, ever. Three months free when you join."
    />
    <meta name="twitter:image" content="https://lenstrybe.com/og-image.png" />
  </head>
